name: Official calendar availability
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - name: Refresh published official years
        run: python -m sg_deadline.cli --calendar-cache .calendar-watch calendars refresh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-calendar-snapshots
          path: .calendar-watch/
          retention-days: 30
