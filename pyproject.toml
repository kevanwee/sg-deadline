[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-deadline"
version = "0.1.0"
description = "Deterministic legal deadline engine for Singapore. Rules as data, every answer with a derivation trace. Library, CLI and MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "python-dateutil>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.5", "mcp>=1.2"]

[project.scripts]
sg-deadline = "sg_deadline.cli:main"
sg-deadline-mcp = "sg_deadline.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
